name: Deploy site to Vercel

# Optional. Only needed if you want GitHub to push the site for you.
# Easier path: vercel.com → Add New → Import this GitHub repo.
# Then add DEEPSEEK_API_KEY in the Vercel project Environment Variables.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "No VERCEL_TOKEN secret. Skip deploy. Import the repo at vercel.com instead."
            exit 0
          fi
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel deploy --yes --prod --token="$VERCEL_TOKEN" --env DEEPSEEK_API_KEY="$DEEPSEEK_API_KEY"
