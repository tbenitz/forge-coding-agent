name: Generate code

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "What code should Forge write?"
        required: true
        type: string
      code_type:
        description: "website, python, javascript, react, any..."
        required: false
        default: "website"
        type: string
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  generate:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && contains(join(github.event.issue.labels.*.name, ','), 'generate'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Read prompt
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_PROMPT: ${{ github.event.inputs.prompt }}
          DISPATCH_TYPE: ${{ github.event.inputs.code_type }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          python3 <<'PY'
          import os, json, re, pathlib
          event = os.environ.get("EVENT")
          if event == "workflow_dispatch":
              prompt = os.environ.get("DISPATCH_PROMPT") or ""
              code_type = os.environ.get("DISPATCH_TYPE") or "any"
          else:
              body = os.environ.get("ISSUE_BODY") or ""
              title = os.environ.get("ISSUE_TITLE") or ""
              def field(name):
                  m = re.search(r"### " + re.escape(name) + r"\n+(.+?)(?:\n### |\Z)", body, re.S)
                  return (m.group(1).strip() if m else "")
              code_type = field("Code type") or "any"
              prompt = field("What should it write?") or title.replace("[generate]", "").strip()
          prompt = prompt.strip()
          if not prompt:
              raise SystemExit("Prompt was empty")
          pathlib.Path("generated").mkdir(exist_ok=True)
          pathlib.Path("generated/input.json").write_text(json.dumps({"prompt": prompt, "code_type": code_type}, indent=2))
          print("PROMPT_LENGTH", len(prompt))
          print("CODE_TYPE", code_type)
          PY

      - name: Generate with DeepSeek secret
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-flash
          MAX_TOKENS: "8000"
        run: |
          PROMPT="$(python3 -c 'import json; print(json.load(open("generated/input.json"))["prompt"])')"
          CODE_TYPE="$(python3 -c 'import json; print(json.load(open("generated/input.json"))["code_type"])')"
          export PROMPT CODE_TYPE
          node scripts/generate.mjs

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated
          if git diff --cached --quiet; then
            echo "No generated files"
          else
            git commit -m "Generate code from GitHub Action"
            git push
          fi

      - name: Comment on issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body-file generated/last-reply.md
